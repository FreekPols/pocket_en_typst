name: Typst build

on:
  push:
    branches:
      - main
  

jobs:
  build_typst_documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Build PDF
        run: typst compile 200demos.typ en_version.pdf

      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: en_version.pdf